name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Cache the Nix store in the GitHub Actions cache (no external account
      # needed). Keyed on the flakes and their locks so it invalidates on updates.
      # Cleanup relies on GitHub's built-in eviction (7-day inactivity + 10 GB
      # LRU), which is per-repository and does not affect other repos in the org.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Trim the store before saving to stay within the cache size limit.
          gc-max-store-size-linux: 5G

      # Builds and tests the top-level flake and, via its `checks`, all sub-flakes.
      - run: nix flake check -L
